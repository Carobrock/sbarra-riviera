[[edge_functions]]
  function = "transiti"
  path = "/api/transiti"

# Il motore di calcolo (motore.js) sta alla radice: file statico per il
# telefono, importato con percorso relativo dalla funzione edge. Un file solo.

# Nessun proxy aperto verso ViaggiaTreno: nel sito di Loano /vt/* permetteva a
# chiunque di interrogare RFI attraverso il nostro dominio e i nostri crediti.
# Qui l'unico canale verso RFI e' la funzione edge, con la sua cache.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/linea.json"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/percorsi-*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
